<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Nuevo Ticket</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --color-primary: #1e40af;
        --color-secondary: #f3f4f6;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--color-secondary);
      }

      .drag-drop-area {
        border: 2px dashed #9ca3af;
        background-color: #f9fafb;
        min-height: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: border-color 0.3s;
      }

      .drag-drop-area:hover {
        border-color: var(--color-primary);
      }
    </style>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-7xl mx-auto bg-white shadow-lg">
      <!-- HEADER -->
      <header
        class="flex items-center justify-between p-4 border-b border-gray-200 bg-white sticky top-0 z-10"
      >
        <div class="flex items-center">
          <a href="/kanban" class="text-gray-500 hover:text-gray-800 mr-3">
            <!-- Icono regresar -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
          </a>
          <div>
            <h1 class="text-xl font-semibold text-gray-800">
              Crear Nuevo Ticket
            </h1>
            <p class="text-sm text-gray-500">
              Completa la información requerida del ticket
            </p>
          </div>
        </div>

        <div class="space-x-2">
          <a
            href="/kanban"
            class="px-4 py-2 text-sm font-medium bg-white border border-gray-300 rounded-lg hover:bg-gray-50"
            >Cancelar</a
          >
          <button
            form="formTicket"
            class="px-4 py-2 text-sm font-medium text-white bg-gray-900 rounded-lg hover:bg-gray-800"
          >
            Crear Ticket
          </button>
        </div>
      </header>

      <!-- FORMULARIO -->
      <main class="p-6 md:p-10">
        <form
          id="formTicket"
          action="/ticket/crear"
          method="POST"
          enctype="multipart/form-data"
          class="space-y-8"
        >
          <!-- 1. Información del ticket -->
          <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
            <h2 class="text-lg font-semibold text-gray-800 mb-2">
              Información del Ticket
            </h2>

            <!-- Título -->
            <div class="mb-5">
              <label class="text-sm font-medium text-gray-700">Título *</label>
              <input
                type="text"
                name="titulo"
                required
                minlength="5"
                placeholder="Ej: Problema con el inicio de sesión"
                class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring-blue-500"
              />
            </div>

            <!-- Cliente + Prioridad -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-5">
              <div>
                <label class="text-sm font-medium text-gray-700"
                  >Cliente *</label
                >
                <select
                  name="cliente"
                  required
                  class="mt-1 w-full px-3 py-2 border rounded-lg"
                >
                  <option>Tech Solutions SA</option>
                  <option>Innovación Global SL</option>
                  <option>Servicios Alfa</option>
                </select>
              </div>

              <div>
                <label class="text-sm font-medium text-gray-700"
                  >Prioridad *</label
                >
                <select
                  name="prioridad"
                  required
                  class="mt-1 w-full px-3 py-2 border rounded-lg"
                >
                  <option>Urgente</option>
                  <option>Alta</option>
                  <option>Media</option>
                  <option>Baja</option>
                </select>
              </div>
            </div>

            <!-- Categoría + Asignado -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-5">
              <div>
                <label class="text-sm font-medium text-gray-700"
                  >Categoría *</label
                >
                <select
                  name="categoria"
                  required
                  class="mt-1 w-full px-3 py-2 border rounded-lg"
                >
                  <option>Soporte Técnico</option>
                  <option>Hardware</option>
                  <option>Software</option>
                </select>
              </div>

              <div>
                <label class="text-sm font-medium text-gray-700"
                  >Asignado a</label
                >
                <select
                  name="asignado"
                  class="mt-1 w-full px-3 py-2 border rounded-lg"
                >
                  <option>Sin asignar</option>
                  <!-- Técnicos fijos -->
                  <option value="Juan Pérez">Juan Pérez</option>
                  <option value="María López">María López</option>
                  <option value="Carlos Gómez">Carlos Gómez</option>
                  <option value="Ana Torres">Ana Torres</option>
                </select>
              </div>
            </div>

            <!-- Estado -->
            <div class="mb-5">
              <label class="text-sm font-medium text-gray-700">Estado *</label>
              <select
                name="estado"
                required
                class="mt-1 w-full px-3 py-2 border rounded-lg"
              >
                <option>Nuevo</option>
                <option>En Progreso</option>
                <option>En Espera</option>
                <option>Completado</option>
              </select>
            </div>

            <!-- Descripción -->
            <div>
              <label class="text-sm font-medium text-gray-700"
                >Descripción *</label
              >
              <textarea
                name="descripcion"
                rows="4"
                required
                minlength="20"
                placeholder="Describe el problema o solicitud..."
                class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring-blue-500"
              ></textarea>
              <p class="text-xs text-gray-500">Mínimo 20 caracteres</p>
            </div>
          </div>

          <!-- 2. Datos de contacto + etiquetas + fecha límite -->
          <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
            <!-- Email + Teléfono -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <div>
                <label class="text-sm font-medium text-gray-700">Email *</label>
                <input
                  type="email"
                  name="email"
                  required
                  class="mt-1 w-full px-3 py-2 border rounded-lg"
                />
              </div>

              <div>
                <label class="text-sm font-medium text-gray-700"
                  >Teléfono</label
                >
                <input
                  type="tel"
                  name="telefono"
                  class="mt-1 w-full px-3 py-2 border rounded-lg"
                />
              </div>
            </div>

            <!-- Fecha límite -->
            <div class="mb-6">
              <label class="text-sm font-medium text-gray-700"
                >Fecha Límite</label
              >
              <input
                type="date"
                name="fecha_limite"
                class="mt-1 w-full px-3 py-2 border rounded-lg"
              />
            </div>

            <!-- Archivos -->
            <div class="mb-8">
              <label class="text-sm font-medium text-gray-700 mb-2"
                >Archivos Adjuntos</label
              >
              <div
                class="drag-drop-area rounded-lg"
                onclick="document.getElementById('file-upload').click();"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-10 w-10 text-gray-400 mb-3"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 014 4.903m-1.256 5.518L13 14.939V17h-2v-2.061l-5.644-2.518A7.001 7.001 0 0012 21a7.001 7.001 0 005.888-3.482z"
                  />
                </svg>
                <p class="text-sm text-gray-500">
                  Haz clic o arrastra archivos
                </p>
                <p class="text-xs text-gray-400">PDF / JPG / PNG — Máx 10MB</p>
                <input
                  id="file-upload"
                  name="archivos"
                  type="file"
                  multiple
                  class="hidden"
                />
              </div>
            </div>
          </div>
        </form>

        <!-- FOOTER -->
        <footer
          class="mt-8 flex justify-between items-center pt-4 border-t border-gray-200"
        >
          <p class="text-xs text-gray-500 flex items-center">
            Los cambios se guardarán automáticamente
          </p>

          <button
            form="formTicket"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 flex items-center"
          >
            Crear Ticket
          </button>
        </footer>
      </main>
    </div>
  </body>
</html>
