<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Ticket - Formulario</title>
    <!-- Incluye Tailwind CSS para el diseño y la responsividad -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Configuración de color principal para simular el tema */
      :root {
        --color-primary: #1e40af; /* Azul oscuro */
        --color-secondary: #f3f4f6; /* Gris claro de fondo */
        --color-accent: #6b7280; /* Gris para textos secundarios */
      }

      /* Aplicar la fuente Inter por defecto */
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--color-secondary);
      }

      /* Estilo para el drag and drop area */
      .drag-drop-area {
        border: 2px dashed #9ca3af;
        background-color: #f9fafb;
        min-height: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.3s;
      }
      .drag-drop-area:hover {
        border-color: var(--color-primary);
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-7xl mx-auto bg-white shadow-lg">
      <!-- Barra Superior / Header del Formulario -->
      <header
        class="flex items-center justify-between p-4 border-b border-gray-200 sticky top-0 bg-white z-10"
      >
        <div class="flex items-center">
          <a href="#" class="text-gray-500 hover:text-gray-800 mr-4">
            <!-- Icono de flecha hacia atrás (simulación de 'Atrás') -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
          </a>
          <div>
            <h1 class="text-xl font-semibold text-gray-800">Nuevo Ticket</h1>
            <p class="text-sm text-gray-500">
              Completa la información del ticket
            </p>
          </div>
        </div>
        <div class="space-x-2">
          <button
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition duration-150"
          >
            Cancelar
          </button>
          <button
            class="px-4 py-2 text-sm font-medium text-white bg-gray-900 rounded-lg hover:bg-gray-800 transition duration-150"
          >
            Crear Ticket
          </button>
        </div>
      </header>

      <!-- Contenido Principal del Formulario -->
      <main class="p-6 md:p-10">
        <form action="#" method="POST" class="space-y-8">
          <!-- 1. Sección: Información del Ticket -->
          <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
            <h2 class="text-lg font-semibold text-gray-800 mb-1">
              Información del Ticket
            </h2>
            <p class="text-sm text-gray-500 mb-6">
              Los campos marcados con * son obligatorios
            </p>

            <!-- Título del Ticket -->
            <div class="mb-6">
              <label
                for="titulo"
                class="block text-sm font-medium text-gray-700 after:content-['*'] after:ml-0.5 after:text-red-500"
                >Título del Ticket</label
              >
              <input
                type="text"
                id="titulo"
                name="titulo"
                placeholder="Ej: Problema con el inicio de sesión"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                required
              />
            </div>

            <!-- Cliente y Prioridad (en la misma fila) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <!-- Cliente -->
              <div>
                <label
                  for="cliente"
                  class="block text-sm font-medium text-gray-700 after:content-['*'] after:ml-0.5 after:text-red-500"
                  >Cliente</label
                >
                <select
                  id="cliente"
                  name="cliente"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white"
                  required
                >
                  <option>Tech Solutions SA</option>
                  <option>Innovación Global SL</option>
                  <option>Servicios Alfa</option>
                </select>
              </div>
              <!-- Prioridad -->
              <div>
                <label
                  for="prioridad"
                  class="block text-sm font-medium text-gray-700 after:content-['*'] after:ml-0.5 after:text-red-500"
                  >Prioridad</label
                >
                <select
                  id="prioridad"
                  name="prioridad"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white"
                  required
                >
                  <option>Urgente</option>
                  <option>Alta</option>
                  <option>Media</option>
                  <option>Baja</option>
                </select>
              </div>
            </div>

            <!-- Categoría y Asignado a (en la misma fila) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <!-- Categoría -->
              <div>
                <label
                  for="categoria"
                  class="block text-sm font-medium text-gray-700 after:content-['*'] after:ml-0.5 after:text-red-500"
                  >Categoría</label
                >
                <select
                  id="categoria"
                  name="categoria"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white"
                  required
                >
                  <option>Soporte Técnico</option>
                  <option>Fallas de Hardware</option>
                  <option>Consultoría de Software</option>
                </select>
              </div>
              <!-- Asignado a -->
              <div>
                <label
                  for="asignar"
                  class="block text-sm font-medium text-gray-700"
                  >Asignado a</label
                >
                <select
                  id="asignar"
                  name="asignar"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white"
                >
                  <option>Sin asignar</option>
                  <option>Agente A</option>
                  <option>Agente B</option>
                </select>
              </div>
            </div>

            <!-- Descripción -->
            <div>
              <label
                for="descripcion"
                class="block text-sm font-medium text-gray-700 after:content-['*'] after:ml-0.5 after:text-red-500"
                >Descripción</label
              >
              <textarea
                id="descripcion"
                name="descripcion"
                rows="4"
                placeholder="Describe el problema o solicitud en detalle..."
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                required
              ></textarea>
              <p class="mt-1 text-xs text-gray-500">Mínimo 20 caracteres</p>
            </div>
          </div>

          <!-- 2. Sección: Contacto, Archivos, Etiquetas y Opciones Adicionales (Continuación) -->
          <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
            <!-- Email y Teléfono (en la misma fila) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
              <!-- Email de Contacto -->
              <div>
                <label
                  for="email"
                  class="block text-sm font-medium text-gray-700 after:content-['*'] after:ml-0.5 after:text-red-500"
                  >Email de Contacto</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  value="contacto@ejemplo.com"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                  required
                />
              </div>
              <!-- Teléfono -->
              <div>
                <label
                  for="telefono"
                  class="block text-sm font-medium text-gray-700"
                  >Teléfono</label
                >
                <input
                  type="tel"
                  id="telefono"
                  name="telefono"
                  value="+52 55 1234 5678"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                />
              </div>
            </div>

            <!-- Archivos Adjuntos (Drag and Drop Area) -->
            <div class="mb-8">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Archivos Adjuntos</label
              >
              <div class="drag-drop-area rounded-lg">
                <!-- Icono de Nube -->
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-10 w-10 text-gray-400 mb-2"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 014 4.903m-1.256 5.518L13 14.939V17h-2v-2.061l-5.644-2.518A7.001 7.001 0 0012 21a7.001 7.001 0 005.888-3.482z"
                  />
                </svg>
                <p class="text-sm text-gray-500">
                  Haz clic para subir o arrastra los archivos aquí
                </p>
                <p class="text-xs text-gray-400">PNG, JPG, PDF hasta 10MB</p>
                <input type="file" multiple class="hidden" id="file-upload" />
              </div>
            </div>
          </div>
        </form>

        <!-- Footer y Botones de Acción Final -->
        <footer
          class="mt-8 flex justify-between items-center pt-4 border-t border-gray-200"
        >
          <p class="text-xs text-gray-500 flex items-center">
            <!-- Icono de Información -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 mr-1"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            Todos los cambios se guardarán automáticamente
          </p>
          <div class="space-x-3">
            <button
              class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition duration-150"
            >
              Guardar Borrador
            </button>
            <button
              class="px-4 py-2 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 transition duration-150 flex items-center"
            >
              <!-- Icono de Check / Tilde -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 mr-1"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 13l4 4L19 7"
                />
              </svg>
              Crear Ticket
            </button>
          </div>
        </footer>
      </main>
    </div>
  </body>
</html>
